{{- $clusterID := .Values.agent.clusterID | default "" -}}
{{- if and $clusterID (not (regexMatch "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$" $clusterID)) -}}
{{- fail "agent.clusterID must be letters, digits, '.', '_' or '-', at most 63 characters, starting with a letter or digit" -}}
{{- end -}}
{{- if gt (len .Values.agent.allowedAnnotations) 10 -}}
{{- fail "agent.allowedAnnotations names more than 10 keys" -}}
{{- end -}}
{{- /*
Values sit in the release, which anyone who can read its Secret reads, so proxy credentials belong in
a Secret the chart only references. The refusal never prints the value, which would show them.
*/ -}}
{{- $proxy := .Values.agent.reportHTTPProxy | default "" -}}
{{- $proxySecret := .Values.agent.reportHTTPProxySecret | default dict -}}
{{- if regexMatch "^\\s*([A-Za-z][A-Za-z0-9+.-]*://)?[^/?#]*@" $proxy -}}
{{- fail "agent.reportHTTPProxy carries credentials: put the proxy URL in a Secret and name it in agent.reportHTTPProxySecret" -}}
{{- end -}}
{{- if ne (empty $proxySecret.name) (empty $proxySecret.key) -}}
{{- fail "agent.reportHTTPProxySecret needs both name and key: the Secret and its key holding the proxy URL" -}}
{{- end -}}
{{- if and $proxy $proxySecret.name -}}
{{- fail "set agent.reportHTTPProxy or agent.reportHTTPProxySecret, not both" -}}
{{- end -}}
{{- $caBundle := .Values.agent.reportCABundle | default dict -}}
{{- if and $caBundle.configMap $caBundle.secret -}}
{{- fail "agent.reportCABundle names a ConfigMap and a Secret: name one of the two" -}}
{{- end -}}
{{- $caDir := "/etc/costfluent/report-ca" -}}
{{- /*
A claim no StorageClass can provision stays Pending, and the pod with it, before the agent can log
why. Offline renders (helm template, Argo CD) get an empty map from lookup, with no items key, and
pass. An upgrade cannot change an installed release's claim, which may already be bound, so only an
install is checked.
*/ -}}
{{- if and .Release.IsInstall .Values.persist -}}
{{- $classes := lookup "storage.k8s.io/v1" "StorageClass" "" "" -}}
{{- if hasKey $classes "items" -}}
{{- $named := .Values.persist.storageClassName | default "" -}}
{{- $provisioned := false -}}
{{- range $classes.items -}}
{{- $annotations := .metadata.annotations | default dict -}}
{{- if $named -}}
{{- if eq .metadata.name $named -}}{{- $provisioned = true -}}{{- end -}}
{{- else if or (eq (get $annotations "storageclass.kubernetes.io/is-default-class") "true") (eq (get $annotations "storageclass.beta.kubernetes.io/is-default-class") "true") -}}
{{- $provisioned = true -}}
{{- end -}}
{{- end -}}
{{- if and (not $provisioned) $named -}}
{{- fail (printf "persist.storageClassName names StorageClass %q, which this cluster does not have, so the agent's volume claim would stay Pending: name one of its classes (kubectl get storageclass), or set persist=null for an emptyDir" $named) -}}
{{- else if not $provisioned -}}
{{- fail "this cluster has no default StorageClass, so the agent's volume claim would stay Pending: set persist.storageClassName to one of its classes (kubectl get storageclass), or persist=null for an emptyDir" -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- /*
A number from a values file or --set-json is a float64 here, and quote prints a float64 of a million
or more as 1e+06, which the agent refuses as not a whole number; --set passes an int64. toJson writes
the float64 in digits, a fraction kept so the agent still refuses it.
*/ -}}
{{- define "costfluent-agent.number" -}}
{{- if kindIs "float64" . -}}{{- toJson . | quote -}}{{- else -}}{{- quote . -}}{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "costfluent-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "costfluent-agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "costfluent-agent.fullname" . }}
  selector:
    matchLabels:
      {{- include "costfluent-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if and .Values.agent.token (not .Values.agent.secret.name) }}
        checksum/token: {{ .Values.agent.token | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "costfluent-agent.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "costfluent-agent.serviceAccountName" . }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: agent
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: COSTFLUENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "costfluent-agent.secretName" . }}
                  key: {{ include "costfluent-agent.secretKey" . }}
            {{- with $clusterID }}
            - name: COSTFLUENT_CLUSTER_ID
              value: {{ . | quote }}
            {{- end }}
            - name: COSTFLUENT_API_ENDPOINT
              value: {{ .Values.agent.apiEndpoint | quote }}
            - name: COSTFLUENT_POLLING_INTERVAL
              value: {{ include "costfluent-agent.number" .Values.agent.pollingInterval }}
            - name: COSTFLUENT_NODE_ADDRESS_TYPES
              value: {{ .Values.agent.nodeAddressTypes | quote }}
            - name: COSTFLUENT_KUBE_SKIP_TLS_VERIFY
              value: {{ .Values.agent.disableKubeTLSverify | quote }}
            - name: COSTFLUENT_ALLOWED_LABELS
              value: {{ join "," .Values.agent.allowedLabels | quote }}
            - name: COSTFLUENT_ALLOWED_ANNOTATIONS
              value: {{ join "," .Values.agent.allowedAnnotations | quote }}
            - name: COSTFLUENT_COLLECT_NAMESPACE_LABELS
              value: {{ .Values.agent.collectNamespaceLabels | quote }}
            - name: COSTFLUENT_COLLECT_PVC_LABELS
              value: {{ .Values.agent.collectPVCLabels | quote }}
            - name: COSTFLUENT_KUBE_API_QPS
              value: {{ include "costfluent-agent.number" .Values.agent.kubeAPIQPS }}
            - name: COSTFLUENT_KUBE_API_BURST
              value: {{ include "costfluent-agent.number" .Values.agent.kubeAPIBurst }}
            - name: COSTFLUENT_SCRAPE_CONCURRENCY
              value: {{ include "costfluent-agent.number" .Values.agent.scrapeConcurrency }}
            - name: COSTFLUENT_OWNER_CACHE_SIZE
              value: {{ include "costfluent-agent.number" .Values.agent.ownerCacheSize }}
            - name: COSTFLUENT_REPORT_HTTP_PROXY
              {{- if $proxySecret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $proxySecret.name | quote }}
                  key: {{ $proxySecret.key | quote }}
              {{- else }}
              value: {{ $proxy | quote }}
              {{- end }}
            {{- if or $caBundle.configMap $caBundle.secret }}
            - name: COSTFLUENT_REPORT_CA_FILE
              value: {{ printf "%s/ca.crt" $caDir | quote }}
            {{- end }}
            - name: COSTFLUENT_KUBELET_SERVICE_ACCOUNT
              value: {{ include "costfluent-agent.kubeletServiceAccountName" . | quote }}
            - name: COSTFLUENT_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: COSTFLUENT_DATA_DIR
              value: {{ include "costfluent-agent.dataDir" . | quote }}
            - name: COSTFLUENT_METRICS_PORT
              value: {{ include "costfluent-agent.number" .Values.service.port }}
            - name: COSTFLUENT_LOG_LEVEL
              value: {{ .Values.agent.logLevel | quote }}
            - name: COSTFLUENT_MEMORY_LIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: agent
                  resource: limits.memory
            {{- with .Values.agent.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ include "costfluent-agent.dataDir" . }}
            {{- if or $caBundle.configMap $caBundle.secret }}
            - name: report-ca
              mountPath: {{ $caDir }}
              readOnly: true
            {{- end }}
      {{- if or (not .Values.persist) $caBundle.configMap $caBundle.secret }}
      volumes:
        {{- if not .Values.persist }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- if $caBundle.configMap }}
        - name: report-ca
          configMap:
            name: {{ $caBundle.configMap | quote }}
            items:
              - key: {{ $caBundle.key | quote }}
                path: ca.crt
        {{- else if $caBundle.secret }}
        - name: report-ca
          secret:
            secretName: {{ $caBundle.secret | quote }}
            items:
              - key: {{ $caBundle.key | quote }}
                path: ca.crt
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persist }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.persist.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persist.size | default "1Gi" }}
  {{- end }}
