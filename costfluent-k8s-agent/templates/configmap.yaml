apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "costfluent-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "costfluent-agent.labels" . | nindent 4 }}
data:
  config.yaml: |
    cluster_id: {{ .Values.agent.clusterId | quote }}
    cluster_name: {{ .Values.agent.clusterName | quote }}
    api_endpoint: {{ .Values.agent.apiEndpoint | quote }}
    polling_interval: {{ .Values.agent.pollingInterval }}s
    reporting_interval: {{ .Values.agent.reportingInterval }}s
    heartbeat_interval: {{ .Values.agent.heartbeatInterval }}s
    {{- if .Values.agent.namespaceInclude }}
    namespace_include:
      {{- toYaml .Values.agent.namespaceInclude | nindent 6 }}
    {{- end }}
    namespace_exclude:
      {{- toYaml .Values.agent.namespaceExclude | nindent 6 }}
    collect_annotations: {{ .Values.agent.collectAnnotations }}
    {{- if .Values.agent.allowedAnnotations }}
    allowed_annotations:
      {{- toYaml .Values.agent.allowedAnnotations | nindent 6 }}
    {{- end }}
    max_annotations: {{ .Values.agent.maxAnnotations }}
    max_annotation_length: {{ .Values.agent.maxAnnotationLength }}
    collect_namespace_labels: {{ .Values.agent.collectNamespaceLabels }}
    data_dir: /data
    metrics_enabled: {{ .Values.metrics.enabled }}
    metrics_port: {{ .Values.metrics.port }}
    log_level: {{ .Values.agent.logLevel | quote }}
    log_format: {{ .Values.agent.logFormat | quote }}
