apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "costfluent-agent.fullname" . }}
  labels:
    {{- include "costfluent-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["list", "watch"]
  # Persistent volumes and their storage classes, to price each volume and give it to the pods
  # mounting its claim.
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["list", "watch"]
  {{- if .Values.agent.collectPVCLabels }}
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["list"]
  {{- end }}
  # The kubelet's /metrics/resource endpoint, read on each node's secure port.
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
  {{- if .Values.agent.collectNamespaceLabels }}
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
  {{- end }}
  # Resolving a pod's ReplicaSet to its Deployment and a Job to its CronJob.
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get"]
