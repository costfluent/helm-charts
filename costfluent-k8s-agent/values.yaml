# Costfluent Kubernetes agent. Every agent.* key sets one COSTFLUENT_* environment variable; the
# agent's README lists them.

agent:
  # The cluster token Costfluent shows once under Kubernetes, Clusters, Add cluster (or Mint token
  # on the cluster). It names its cluster and may report only that one; the agent reads which at
  # start and exits on a token every report would be refused with. Either set it here, and the
  # chart creates a Secret for it, or name an existing Secret in agent.secret. A cluster token does
  # not expire; it stops when revoked or when the account that minted it is disabled or deleted.
  # Rotate it as the chart README's "Rotate the token" says. Changing this value rolls the pod; a
  # changed agent.secret needs a restart of the StatefulSet.
  token: ""
  # Optional. The cluster's ID in Costfluent, which the token already names; when set, the agent
  # exits unless it is the token's cluster. Letters, digits, '.', '_' and '-', at most 63
  # characters, starting with a letter or digit.
  clusterID: ""
  # An existing Secret holding the token, used instead of agent.token.
  secret:
    name: ""
    key: token

  apiEndpoint: https://api.costfluent.com
  # Seconds between polls: 5, 10, 15, 30 or 60.
  pollingInterval: 60
  # The node address types tried, in order, to reach each kubelet on its secure port.
  nodeAddressTypes: InternalIP,InternalDNS,Hostname,ExternalIP,ExternalDNS
  # Skip verifying kubelet serving certificates. Needed where kubelets serve self-signed
  # certificates, as kind and Talos do by default.
  disableKubeTLSverify: false

  # Pod label keys to send. Empty sends every pod label.
  allowedLabels: []
  # Pod annotation keys to send, at most 10, values cut to 100 characters. Empty sends none.
  allowedAnnotations: []
  # Send each namespace's labels with its pods.
  collectNamespaceLabels: false

  # Requests a second and the burst allowed to the Kubernetes API server. Most go to resolving
  # each new ReplicaSet and Job to its Deployment or CronJob.
  kubeAPIQPS: 50
  kubeAPIBurst: 100
  # The most kubelets scraped at once. The agent scrapes a twentieth of the cluster's nodes at
  # once, at least 10, and never more than this.
  scrapeConcurrency: 20
  # How many resolved ReplicaSet and Job owners the agent remembers. Size it above the cluster's
  # ReplicaSets and Jobs that run pods, or owners are fetched again each poll.
  ownerCacheSize: 20000

  # A proxy for report traffic only, such as http://proxy.internal:3128.
  reportHTTPProxy: ""
  logLevel: info
  # Extra environment variables for the agent container.
  extraEnv: []

# The buffer of unsent reports, the open window's snapshot, the agent's instance ID and the cluster
# it read from its token live here. Set persist to null to use an emptyDir, which loses them when the
# pod is rescheduled. size, storageClassName and persist: null are fixed at install, because an
# upgrade cannot change a StatefulSet's volume claim.
persist:
  mountPath: /var/lib/costfluent
  size: 1Gi
  storageClassName: ""

image:
  repository: ghcr.io/costfluent/k8s-agent
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
podLabels: {}
podAnnotations: {}
priorityClassName: ""

serviceAccount:
  create: true
  # Defaults to the release's full name.
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Serves /metrics, /healthz and /readyz.
service:
  port: 9010

serviceMonitor:
  enabled: false
  interval: 60s
  labels: {}
