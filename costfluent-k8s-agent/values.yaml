# Costfluent Kubernetes agent. Every agent.* key sets one COSTFLUENT_* environment variable; the
# agent's README lists them.

agent:
  # An organization API token with the Report Kubernetes usage capability. Either set it here, and
  # the chart creates a Secret for it, or name an existing Secret in agent.secret.
  token: ""
  # Required. Names this cluster in Costfluent: letters, digits, '.', '_' and '-', at most 63
  # characters, starting with a letter or digit. The first report registers it.
  clusterID: ""
  # An existing Secret holding the token, used instead of agent.token.
  secret:
    name: ""
    key: token

  apiEndpoint: https://api.costfluent.com
  # Seconds between polls: 5, 10, 15, 30 or 60.
  pollingInterval: 60
  # The node address types tried, in order, to reach each kubelet on its secure port.
  nodeAddressTypes: InternalIP,InternalDNS,Hostname,ExternalIP,ExternalDNS
  # Skip verifying kubelet serving certificates. Needed where kubelets serve self-signed
  # certificates, as kind and Talos do by default.
  disableKubeTLSverify: false

  # Pod label keys to send. Empty sends every pod label.
  allowedLabels: []
  # Pod annotation keys to send, at most 10, values cut to 100 characters. Empty sends none.
  allowedAnnotations: []
  # Send each namespace's labels with its pods.
  collectNamespaceLabels: false

  # A proxy for report traffic only, such as http://proxy.internal:3128.
  reportHTTPProxy: ""
  logLevel: info
  # Extra environment variables for the agent container.
  extraEnv: []

# The buffer of unsent reports and the open window's snapshot live here. Set persist to null to
# use an emptyDir, which loses both when the pod is rescheduled.
persist:
  mountPath: /var/lib/costfluent
  size: 1Gi
  storageClassName: ""

image:
  repository: ghcr.io/costfluent/k8s-agent
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
podLabels: {}
podAnnotations: {}
priorityClassName: ""

serviceAccount:
  create: true
  # Defaults to the release's full name.
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Serves /metrics, /healthz and /readyz.
service:
  port: 9010

serviceMonitor:
  enabled: false
  interval: 60s
  labels: {}
