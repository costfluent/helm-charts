name: release

# Mirrored from the Costfluent monorepo at toolkit/helm-charts/ and runs in the public repository,
# which is where it has to run: the Helm repository is this repository's GitHub Pages site, and the
# monorepo is private. The tag that triggers it is pushed by
# `scripts/publish-public.sh release helm-charts vX.Y.Z` after the sync pull request merges; that
# script has already refused a chart whose appVersion image is missing, and this checks again.
#
# Do not edit this file here. Edit it in the monorepo and publish; a change made in the public
# repository is destroyed by the next sync.

on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: package and index
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check versions and images
        run: |
          set -euo pipefail
          for chart in */Chart.yaml; do
            dir="$(dirname "$chart")"
            version="$(helm show chart "$dir" | sed -n 's/^version: *//p')"
            app_version="$(helm show chart "$dir" | sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
            repository="$(helm show values "$dir" | awk '/^image:/ { i = 1; next } /^[^[:space:]#]/ { i = 0 } i && $1 == "repository:" { print $2; exit }')"
            if [ "v$version" != "$TAG" ]; then
              echo "::error::$chart has version $version, but the tag is $TAG"
              exit 1
            fi
            if ! docker manifest inspect "$repository:$app_version" >/dev/null; then
              echo "::error::$repository:$app_version does not exist; release the agent before the chart"
              exit 1
            fi
          done

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p .release
          for chart in */Chart.yaml; do
            helm package "$(dirname "$chart")" --destination .release
          done

      # The packages are release assets; gh-pages holds only index.yaml, which points at them.
      - name: Create release
        run: gh release create "$TAG" .release/*.tgz --title "$TAG" --generate-notes --verify-tag

      - name: Merge the Helm repository index
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages
            git worktree add .pages origin/gh-pages
          else
            git worktree add --detach .pages
            git -C .pages checkout --orphan gh-pages
            git -C .pages rm -rf --quiet .
          fi
          existing=()
          [ -f .pages/index.yaml ] && existing=(--merge .pages/index.yaml)
          helm repo index .release \
            --url "https://github.com/${{ github.repository }}/releases/download/$TAG" "${existing[@]}"
          cp .release/index.yaml .pages/index.yaml
          git -C .pages add index.yaml
          git -C .pages commit --quiet -m "Index $TAG"
          git -C .pages push origin HEAD:gh-pages
          echo "Published $TAG to $PAGES_URL" >> "$GITHUB_STEP_SUMMARY"
