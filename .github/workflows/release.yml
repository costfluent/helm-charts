name: release

# Runs on a vX.Y.Z tag. The Helm repository is this repository's GitHub Pages site, so the release
# is built here. The tag is only pushed for a chart whose appVersion image exists, and this checks
# again.

on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: package and index
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Check versions and images
        run: |
          set -euo pipefail
          for chart in */Chart.yaml; do
            dir="$(dirname "$chart")"
            bash scripts/release-feed.sh "$dir" >/dev/null
            version="$(helm show chart "$dir" | sed -n 's/^version: *//p')"
            app_version="$(helm show chart "$dir" | sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
            repository="$(helm show values "$dir" | awk '/^image:/ { i = 1; next } /^[^[:space:]#]/ { i = 0 } i && $1 == "repository:" { print $2; exit }')"
            if [ "v$version" != "$TAG" ]; then
              echo "::error::$chart has version $version, but the tag is $TAG"
              exit 1
            fi
            if ! docker manifest inspect "$repository:$app_version" >/dev/null; then
              echo "::error::$repository:$app_version does not exist; release the agent before the chart"
              exit 1
            fi
          done

      - name: Release and index
        run: |
          set -euo pipefail
          bash scripts/release.sh "$TAG"
          echo "Published $TAG to $PAGES_URL" >> "$GITHUB_STEP_SUMMARY"
